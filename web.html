<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID</title>
<style>
html,body{height:100%;margin:0;background:#fff;color:#111;font:16px system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px}
.box{border:1px solid #ccc;border-radius:6px;padding:20px;max-width:100%;text-align:center}
#id{font:15px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin-bottom:14px}
button{font:inherit;padding:7px 16px;border:1px solid #111;border-radius:4px;background:#fff;color:#111;cursor:pointer}
button:focus-visible{outline:3px solid #1d4ed8;outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <div id="id">…</div>
  <button id="copy">Copy</button>
</div>
<script>
const enc = new TextEncoder();
const KEY = 'DWspF_xlQD5HRbxOZt6bFACOKYSu2mgiY8Lr9nmIwwc'; // same key is in decode.html
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
const b64u = u => btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

async function sha(str){
  if (crypto.subtle) return new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(str)));
  let h = 5381; for (const c of str) h = ((h << 5) + h + c.charCodeAt(0)) | 0; // fallback for non-HTTPS
  return enc.encode(String(h >>> 0));
}

function webgl(){
  try{
    const gl = document.createElement('canvas').getContext('webgl');
    if(!gl) return null;
    const x = gl.getExtension('WEBGL_debug_renderer_info');
    return [
      x ? gl.getParameter(x.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
      x ? gl.getParameter(x.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      gl.getParameter(gl.VERSION), gl.getParameter(gl.MAX_TEXTURE_SIZE),
      (gl.getSupportedExtensions() || []).length
    ];
  }catch(e){ return null; }
}

async function canvasHash(){
  try{
    const c = document.createElement('canvas'); c.width = 240; c.height = 60;
    const g = c.getContext('2d');
    g.textBaseline = 'top'; g.font = '16px Arial'; g.fillStyle = '#f60'; g.fillRect(10,5,100,30);
    g.fillStyle = '#069'; g.fillText('Fingerprint \u{1F9EA} 123', 4, 20);
    g.strokeStyle = 'rgba(120,20,200,.6)'; g.arc(150,30,20,0,Math.PI*1.7); g.stroke();
    return b64u(await sha(c.toDataURL()));
  }catch(e){ return null; }
}

async function audioHash(){
  try{
    const ctx = new OfflineAudioContext(1, 5000, 44100);
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 10000;
    const comp = ctx.createDynamicsCompressor();
    o.connect(comp); comp.connect(ctx.destination); o.start(0);
    const buf = await ctx.startRendering();
    return buf.getChannelData(0).slice(4500).reduce((a,b) => a + Math.abs(b), 0).toFixed(8);
  }catch(e){ return null; }
}

function fonts(){
  const list = ['Arial','Calibri','Cambria','Comic Sans MS','Consolas','Courier New','Georgia','Helvetica','Impact','Menlo','Monaco','Segoe UI','SF Pro Text','Roboto','Ubuntu','Noto Sans','Tahoma','Times New Roman','Verdana','Trebuchet MS','Lucida Console','Garamond','Futura','Gill Sans'];
  const s = document.createElement('span');
  s.textContent = 'mmmmmmmmmmlli'; s.style.cssText = 'position:absolute;left:-9999px;font-size:72px';
  document.body.appendChild(s);
  const bases = ['monospace','sans-serif','serif'];
  const w = f => { s.style.fontFamily = f; return s.offsetWidth; };
  const base = bases.map(w);
  const found = list.filter(f => bases.some((b,i) => w(`'${f}',${b}`) !== base[i]));
  s.remove(); return found;
}

async function publicIP(){
  try{
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 3000);
    const r = await fetch('https://api.ipify.org?format=json', {signal: ctl.signal});
    return (await r.json()).ip;
  }catch(e){ return null; }
}

(async () => {
  const n = navigator, s = screen;
  const d = {
    ua: n.userAgent, platform: n.platform, languages: (n.languages || []).join(','),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone, tzOffset: new Date().getTimezoneOffset(),
    screen: [s.width, s.height, s.availWidth, s.availHeight, s.colorDepth, devicePixelRatio],
    cores: n.hardwareConcurrency, mem: n.deviceMemory, touch: n.maxTouchPoints,
    gpu: webgl(), canvas: await canvasHash(), audio: await audioHash(), fonts: fonts()
  };
  try{
    if(n.userAgentData){
      d.uaData = await n.userAgentData.getHighEntropyValues(['architecture','bitness','model','platformVersion','uaFullVersion']);
    }
  }catch(e){}
  d.ip = await publicIP();
  const cs = new CompressionStream('deflate-raw');
  const w = cs.writable.getWriter(); w.write(enc.encode(JSON.stringify(d))); w.close();
  const packed = new Uint8Array(await new Response(cs.readable).arrayBuffer());
  const k = await crypto.subtle.importKey('raw', unb64u(KEY), 'AES-GCM', false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, k, packed));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  document.getElementById('id').textContent = b64u(out);
})();

const btn = document.getElementById('copy');
btn.onclick = async () => {
  try{
    await navigator.clipboard.writeText(document.getElementById('id').textContent);
    btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1200);
  }catch(e){}
};
</script>
</body>
</html>
